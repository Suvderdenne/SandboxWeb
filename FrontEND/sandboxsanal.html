
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Feedback System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top right, #1a0131, #050505);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-top: 80px; /* Дээд цэсэнд зориулж зай */
            padding-bottom: 80px; /* Доод цэсэнд зориулж зай */
        }

        /* ---- ШИНЭ ДЭЭД ЦЭС (Үндсэн цэс) ---- */
        .top-main-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1001;
            gap: 15px;
        }

        .top-main-nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .top-main-nav a:hover, .top-main-nav a.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffb6ff;
            border-color: #a200ff;
        }

        .top-main-nav .logo { height: 30px; margin-right: 10px; }
        .top-main-nav .profile { height: 30px; width: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); margin-left: 10px; }

        /* ---- ШИНЭ ДООД ЦЭС (Admin/Feedback солих) ---- */
        .bottom-switch-nav {
            position: fixed;
            bottom: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 100px;
            display: flex;
            gap: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .switch-item {
            padding: 10px 25px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .switch-item.active {
            background: linear-gradient(45deg, #a200ff, #ff00ea);
            color: #fff;
        }

        /* ---- Агуулгын хэсэг ---- */
        .page-section {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .page-section.active { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #cubeContainer { width: 400px; height: 400px; }

        .card {
            width: 400px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, #a200ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input, textarea {
            width: 100%; padding: 14px; margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; font-family: inherit; outline: none;
        }

        button.main-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(45deg, #a200ff, #ff00ea);
            border: none; border-radius: 12px; color: #fff;
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }

        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(162, 0, 255, 0.4); }

        .admin-card { width: 100%; max-width: 900px; background: rgba(0,0,0,0.2); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .delete-btn { background: #ff4d4d22; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="top-main-nav">
        <img src="Mandakh.webp" class="logo" alt="Logo">
        <a href="timeline.html">Бидний тухай</a>
        <a href="tusuluud.html">Төсөлүүд</a>
        <a href="tex.html">Технологи</a>
        <a href="zahialga.html">Захиалга</a>
        <a href="sandboxsanal.html" class="active">Санал хүсэлт</a>
        <a href="sandbox.html">Холбоо барих</a>
        <img src="profile_icon.svg" class="profile" alt="User">
    </nav>

    <section id="feedback-page" class="page-section active">
        <div id="cubeContainer"></div>
        <div class="card">
            <h2>САНАЛ ХҮСЭЛТ</h2>
            <form id="feedbackForm">
                <input type="text" id="name" placeholder="Таны нэр" required autocomplete="off">
                <input type="email" id="email" placeholder="Имэйл хаяг" required>
                <textarea id="message" rows="4" placeholder="Санал хүсэлтээ энд бичнэ үү..." required></textarea>
                <button type="submit" class="main-btn">ИЛГЭЭХ</button>
            </form>
        </div>
    </section>

    <section id="admin-page" class="page-section">
        <div class="admin-card">
            <h2>ИРСЭН САНАЛУУД</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Нэр</th>
                        <th>Имэйл</th>
                        <th>Мессеж</th>
                        <th>Үйлдэл</th>
                    </tr>
                </thead>
                <tbody id="feedbackList"></tbody>
            </table>
        </div>
    </section>

    <div class="bottom-switch-nav">
        <div class="switch-item active" id="nav-feedback">САНАЛ ӨГӨХ</div>
        <div class="switch-item" id="nav-admin">ХАРАХ (ADMIN)</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // Хуудас солих логик
        const fPage = document.getElementById('feedback-page');
        const aPage = document.getElementById('admin-page');
        const nFeed = document.getElementById('nav-feedback');
        const nAdmin = document.getElementById('nav-admin');

        nFeed.onclick = () => { 
            fPage.classList.add('active'); aPage.classList.remove('active'); 
            nFeed.classList.add('active'); nAdmin.classList.remove('active'); 
        };
        nAdmin.onclick = () => { 
            aPage.classList.add('active'); fPage.classList.remove('active'); 
            nAdmin.classList.add('active'); nFeed.classList.remove('active'); 
            renderAdmin(); 
        };

        // Three.js 3D хэсэг
        const container = document.getElementById('cubeContainer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 8;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(400, 400);
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pLight = new THREE.PointLight(0xa200ff, 100, 50);
        pLight.position.set(5, 5, 5);
        scene.add(pLight);

        const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 1), new THREE.MeshStandardMaterial({ color: 0xa200ff, wireframe: true, transparent: true, opacity: 0.2 }));
        group.add(wire);

        let textMesh;
        const loader = new FontLoader();
        function update3D(txt = "HELLO") {
            loader.load('https://unpkg.com/three@0.159.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                if (textMesh) group.remove(textMesh);
                const geo = new TextGeometry(txt.toUpperCase(), { font, size: 0.5, height: 0.2 });
                geo.center();
                textMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xa200ff }));
                group.add(textMesh);
            });
        }
        update3D();
        document.getElementById('name').oninput = (e) => update3D(e.target.value);

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Өгөгдлийн логик
        window.renderAdmin = () => {
            const list = document.getElementById('feedbackList');
            const data = JSON.parse(localStorage.getItem('feedbacks') || '[]');
            list.innerHTML = data.map((item, i) => `<tr><td>${item.name}</td><td>${item.email}</td><td>${item.message}</td><td><button class="delete-btn" onclick="deleteItem(${i})">X</button></td></tr>`).join('');
        };

        document.getElementById('feedbackForm').onsubmit = (e) => {
            e.preventDefault();
            const data = JSON.parse(localStorage.getItem('feedbacks') || '[]');
            data.push({ name: document.getElementById('name').value, email: document.getElementById('email').value, message: document.getElementById('message').value });
            localStorage.setItem('feedbacks', JSON.stringify(data));
            alert("Илгээгдлээ!"); e.target.reset(); update3D("THANKS");
        };

        window.deleteItem = (i) => {
            let data = JSON.parse(localStorage.getItem('feedbacks'));
            data.splice(i, 1);
            localStorage.setItem('feedbacks', JSON.stringify(data));
            renderAdmin();
        };
    </script>
</body>
</html>
