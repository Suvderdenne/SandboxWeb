<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8" />
    <title>Sandbox - Холбоо барих</title>
    <link rel="stylesheet" href="bruh.css" />
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.78/build/spline-viewer.js"></script>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    height: 100%;
    background-color: #000;
    color: #ff99ff;
    font-family: Arial, sans-serif;
}

#left {
    flex: 1;
    padding: 40px;
    box-sizing: border-box;
    overflow-y: auto;
}

#right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

spline-viewer {
    width: 100%;
    height: 100vh;
    max-width: 600px;
}
.about-image {
            display: block;
            margin: 20px auto 0 auto;
            width: 90%;
            height: 300px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #ff99ff;
            display: flex;
        }

        .left {
            width: 50%;
            background-color: #0f001f;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 30px;
        }

        header {
            background-color: #1a001a;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 0 10px #ff00ff;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            color: #ff00ff;
        }

        #about {
            flex-grow: 1;
            text-align: center;
            margin-top: 40px;
        }

        #about h2 {
            color: #ff66ff;
            margin-bottom: 15px;
        }

        #about p {
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            color: #ffccff;
        }

        footer {
            background-color: #1a001a;
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #ffccff;
            box-shadow: 0 -2px 10px #ff00ff;
            margin-top: 10px;
        }

        footer h2 {
            margin-bottom: 10px;
            color: #ff66ff;
        }

        footer a {
            color: #ff99ff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        #copyButton {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #c821c2;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        #copyButton:hover,
        #copyButton:focus,
        #copyButton:active {
            background: linear-gradient(270deg, #ff00ff, #00ffff, #ff00ff);
            background-size: 600% 600%;
            animation: rgbShift 5s ease infinite;
            box-shadow: 0 0 15px #ff00ff, 0 0 20px #00ffff;
        }

        @keyframes rgbShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .right {
            width: 50%;
            background-color: #1a001a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        spline-viewer {
            width: 90%;
            height: 90%;
            border-radius: 12px;
            box-shadow: 0 0 30px #ff00ff;
        }

        /* Responsive for smaller screens */
        @media (max-width: 768px) {
            html, body {
                flex-direction: column;
                height: auto;
            }

            .left, .right {
                width: 100%;
                height: auto;
                padding: 20px;
            }

            spline-viewer {
                height: 300px !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

    <div class="left">
        <header>
            <h1>Sandbox</h1>
        </header>

        <section id="about">
            <h2>Бидний тухай</h2>
            <p>
                Энд Sandbox клубийн талаар дэлгэрэнгүй мэдээлэл бичнэ үү. Бид таны хүсэл сонирхолд нийцсэн 3D загвар болон бусад мэдээллийг танд хүргэнэ.
            </p>
            <figure>
                <img class="about-image" src="../zuragnuud/6159605.png" alt="Sandbox клубийн танилцуулга зураг (6159605)" />
                <!-- Хэрэв хүсвэл тайлбар бичиж болно -->
                <!-- <figcaption style="color:#ffccff; margin-top:8px;">Sandbox клубийн танилцуулгын зураг</figcaption> -->
            </figure>
        </section>

        <footer>
            <h2>Холбоо барих</h2>
            <p>И-мэйл: <a id="emailAddress" href="mailto:sandbox.team.mn@gmail.com">sandbox.team.mn@gmail.com</a></p>
            <p>Утас: <a id="phoneNumber" href="tel:+97612345678">+976 12345678</a></p>
            <button id="copyButton" title="Утасны дугаарыг хуулна">Утасны дугаарыг залгах</button>
        </footer>
    </div>

    <div class="right">
        <spline-viewer url="https://prod.spline.design/o9nueuZZt04WG8II/scene.splinecode"></spline-viewer>
    </div>

    <script>
        const copyBtn = document.getElementById('copyButton');
        const phoneText = document.getElementById('phoneNumber').textContent.trim();

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(phoneText).then(() => {
                copyBtn.textContent = 'Амжилттай хууллаа!';
                setTimeout(() => {
                    copyBtn.textContent = 'Утасны дугаарыг залгах';
                }, 2000);
            }).catch(err => {
                alert('Хуулж чадсангүй: ' + err);
            });
        });
    </script>

</body>
</html>
