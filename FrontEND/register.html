<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sand Box | Нэвтрэх & Бүртгүүлэх</title>
  <style>
    *{box-sizing:border-box; margin:0; padding:0}
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0b; 
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      display: flex;
      width: 100%;
      height: 100vh;
      background: #2b032b;
    }

    
    .left-side {
      flex: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    spline-viewer { width: 100%; height: 100%; }

    
    .right-side {
      flex: 0.9;
      background: linear-gradient(180deg, #4b064b 0%, #a600a6 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5% 8%;
      color: white;
    }

    .brand { font-size: 65px; font-weight: 900; margin-bottom: 10px; }
    h1 { font-size: 32px; margin-bottom: 5px; }
    p.lead { color: rgba(255,255,255,0.7); margin-bottom: 25px; font-size: 14px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; }
    input, select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: white;
      color: #000;
      font-size: 14px;
      outline: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      align-items: center;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 12px;
      transition: 0.3s;
    }
    .btn-primary { background: #ff2d95; color: white; }
    .btn-ghost { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .card { flex-direction: column; overflow-y: auto; }
      .left-side { height: 300px; flex: none; }
      .right-side { padding: 40px 20px; flex: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="left-side">
      <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.78/build/spline-viewer.js"></script>
      <spline-viewer url="https://prod.spline.design/b1Ya5dnMQwTITU6D/scene.splinecode"></spline-viewer>
    </div>

    <div class="right-side">
      
      <div id="login-panel">
        <div class="brand">Sand Box</div>
        <h1>Нэвтрэх</h1>
        <p class="lead">Нэр болон нууц үгээрээ нэвтэрнэ үү</p>

        <form onsubmit="event.preventDefault(); window.location.href='sandbox.html';">
          <div class="form-group">
            <label>Хэрэглэгчийн нэр</label>
            <input type="text" required placeholder="Нэрээ оруулна уу">
          </div>
          <div class="form-group">
            <label>Нууц үг</label>
            <input type="password" required placeholder="••••••••">
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Нэвтрэх</button>
            <button class="btn btn-ghost" type="button" onclick="toggleView('signup')">Бүртгүүлэх</button>
            <button class="btn btn-ghost" type="button"><a href="index.html" style="text-decoration: none; color: white;">Нүүр хуудас</a></button>
          </div>
        </form>
      </div>

      <div id="signup-panel" class="hidden">
        <div class="brand">Sand Box</div>
        <h1>Бүртгүүлэх</h1>
        <p class="lead">Шинэ акаунт үүсгэнэ үү</p>

        <form onsubmit="event.preventDefault(); alert('Амжилттай бүртгүүллээ!'); toggleView('login');">
          <div class="form-group">
            <label>Нэр</label>
            <input type="text" required placeholder="Овог Нэр">
          </div>
          <div class="form-group">
            <label>Имэйл хаяг</label>
            <input type="email" required placeholder="example@gmail.com">
          </div>
          <div class="form-group">
            <label>Нууц үг</label>
            <input type="password" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Оюутны код</label>
            <input type="text" required placeholder="Оюутны кодоо оруулна уу">
          </div>
          <div class="form-group">
            <label>Одоо байгаа курс</label>
            <select>
              <option>1-курс</option>
              <option>2-курс</option>
              <option>3-курс</option>
              <option>4-курс</option>
            </select>
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>
            <button class="btn btn-ghost" type="button" onclick="toggleView('login')">Буцах</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
    function toggleView(view) {
      const login = document.getElementById('login-panel');
      const signup = document.getElementById('signup-panel');
      if (view === 'signup') {
        login.classList.add('hidden');
        signup.classList.remove('hidden');
      } else {
        signup.classList.add('hidden');
        login.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
