<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SANDBOX</title>
<style>
    body {
        margin: 0;
        font-family: Poppins, sans-serif;
        background: linear-gradient(135deg,#0A0D1C,#211d5b,#8b26b4);
        background-size: 300% 300%;
        animation: bg 12s infinite alternate;
        color: white;
        overflow-x: hidden;
        text-align: center;
    }
    @keyframes bg { 
        0%{background-position:0 0;} 
        100%{background-position:100% 100%;} 
    }

    .title {
        font-size: 48px;
        margin-top: 40px;
        font-weight: 700;
        text-shadow: 0 0 20px #d9b3ff;
    }

    .container {
        margin-top: 40px;
        width: 90%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 30px;
        margin-inline: auto;
    }

    .card {
        background: rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 25px;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: .4s;
        backdrop-filter: blur(8px);
    }
    .card:hover {
        transform: rotateY(12deg) scale(1.07);
        box-shadow: 0 0 25px #eaccff;
    }
    .card h3 {
        font-size: 24px;
        margin-bottom: 12px;
    }
    .card img {
        width: 80px;
        filter: drop-shadow(0 0 5px white);
    }

    /* Modal */
    .modal {
        position: fixed;
        top: 0; left: 0;
        width:100%; height:100%;
        display: none;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        width: 450px;
        background: rgba(255,255,255,0.17);
        border-radius: 18px;
        padding: 25px;
        animation: show .3s;
        color: white;
    }
    @keyframes show {
        from{transform: scale(0.7); opacity: .3;}
        to{transform: scale(1); opacity: 1;}
    }
    .close {
        float: right;
        cursor: pointer;
        font-size: 23px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1 class="title">SANDBOX ашиглаж буй технологиуд</h1>
<p>тухайн тенологийн мэдээллийг харахыг хүсвэл дээр нь дараарай.</p>
<div class="container">
    <section class="tech-section">
    <h2 class="section-title"> FRONTEND ТЕХНОЛОГИ</h2>
    <div class="card-container">

    <div class="card" onclick="openModal('HTML', 'Вэб хуудасны бүтэц, элементүүдийг тодорхойлдог үндсэн хэл.')">
        <img src="https://cdn-icons-png.flaticon.com/512/919/919827.png">
        <h3>HTML</h3>
    </div>

    <div class="card" onclick="openModal('CSS', 'Вэбийн дизайн, өнгө, анимац, байрлалыг удирддаг стил бүрдүүлэгч.')">
        <img src="https://cdn-icons-png.flaticon.com/512/919/919826.png">
        <h3>CSS</h3>
    </div>

    <div class="card" onclick="openModal('JavaScript', 'Frontend-ийн логик, интерактив үйлдлүүд, DOM удирдана.')">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png">
        <h3>JavaScript</h3>
    </div>

    <div class="card" onclick="openModal('React', 'Нэг хуудаст веб апп, компонент суурьт UI бүтээх JS сан.')">
        <img src="https://cdn-icons-png.flaticon.com/512/919/919851.png">
        <h3>React.js</h3>
    </div>
<section class="tech-section">
    <h2 class="section-title"> BACKEND ТЕХНОЛОГИ</h2>
    <div class="card-container">
    <div class="card" onclick="openModal('Node.js', 'Backend серверийн орчин, JavaScript-ийг сервер дээр ажиллуулдаг.')">
        <img src="https://cdn-icons-png.flaticon.com/512/919/919825.png">
        <h3>Node.js</h3>
    </div>

    <div class="card" onclick="openModal( 'тодорхой зорилгоор олж цуглуулсан, тодорхой зохион байгуулалттайгаар компьютерын тогтмол санах ойд хадгалсан цогц өгөгдлийн цуглуулга.')">
        <img src="c:\Users\Hp\Downloads\download.png">
        <h3>Database</h3>
    </div>
     <div class="card" onclick="openModal('Express.js буюу зүгээр л Express нь Node.js-д зориулсан хамгийн алдартай, үнэ төлбөргүй, нээлттэй эх бүхий сервер талын (back-end) вэб програмын хүрээ (framework) юм. Энэ нь вэб болон гар утасны аппликейшн, API (Application Programming Interface) үүсгэхэд зориулагдсан. ')">
        <img src="c:\Users\Hp\Downloads\download.jpeg">
        <h3>Express</h3>
    </div>
 <div class="card" onclick="openModal('Python',' Хурдан хөгжүүлэлт, өгөгдлийн удирдлагад тохиромжтой backend хэл.')">
        <img src="c:\Users\Hp\Downloads\python_104451.png">
        <h3>Python</h3>
    </div>

</div>

<!-- Modal -->
<div id="techModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
    </div>
</div>

<script>
function openModal(title, desc) {
    document.getElementById('techModal').style.display = 'flex';
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalDesc').innerText = desc;
}
function closeModal() {
    document.getElementById('techModal').style.display = 'none';
}
window.onclick = e => {
    if(e.target == document.getElementById('techModal')) closeModal();
};
</script>

</body>
</html>
