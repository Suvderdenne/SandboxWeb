<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sand Box | Нэвтрэх & Бүртгүүлэх</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a000a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 12px;
    }

    .card {
      display: flex;
      width: 100%;
      max-width: 1240px;
      height: 92vh;
      max-height: 880px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 140px rgba(140, 0, 255, 0.45);
      background: linear-gradient(135deg, #0f000f 0%, #1a001f 100%);
      animation: cardEntrance 1.1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      opacity: 0;
      transform: scale(0.95) translateY(30px);
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ==================== ЗҮҮН ТАЛ (Spline) ==================== */
    .left-side {
      flex: 1.22;
      background: #0a000a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .left-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 40% 30%, rgba(140, 0, 255, 0.18) 0%, transparent 70%);
      animation: glowPulse 9s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }

    spline-viewer {
      width: 100%;
      height: 100%;
      filter: brightness(0.96);
    }

    /* ==================== БАРУУН ТАЛ ==================== */
    .right-side {
      flex: 0.92;
      background: linear-gradient(160deg, #2a0033 0%, #4a0066 45%, #6b0099 100%);
      padding: clamp(45px, 7vw, 68px) clamp(30px, 5.5vw, 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow-y: auto;
    }

    .right-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 15, 0.4);
      backdrop-filter: blur(26px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(46px, 8vw, 70px);
      font-weight: 700;
      letter-spacing: -2.8px;
      background: linear-gradient(90deg, #d000ff, #fff, #c300ff);
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: brandBreath 6s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(26px, 5.5vw, 35px);
      margin: 8px 0 12px;
    }

    p.lead {
      color: rgba(255,255,255,0.75);
      font-size: clamp(14.5px, 3.2vw, 15.5px);
      margin-bottom: 32px;
      max-width: 320px;
    }

    .form-group {
      margin-bottom: 21px;
    }

    label {
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 7px;
      color: rgba(255,255,255,0.88);
    }

    input, select {
      width: 100%;
      padding: 15px 19px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 16px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    input:focus, select:focus {
      border-color: #d000ff;
      background: rgba(255,255,255,0.13);
      box-shadow: 0 0 0 4px rgba(208, 0, 255, 0.25);
      transform: translateY(-1px);
    }

    select option {
      background: #2a0033;
      color: #fff;
    }

    .actions {
      display: flex;
      gap: 14px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 32px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      border: none;
      flex: 1;
      min-width: 135px;
    }

    .btn-primary {
      background: linear-gradient(90deg, #d000ff, #ff00cc);
      color: white;
      box-shadow: 0 10px 30px rgba(208, 0, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 18px 45px rgba(208, 0, 255, 0.6);
    }

    .btn-ghost {
      background: transparent;
      color: white;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: #d000ff;
    }

    .hidden { display: none !important; }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 980px) {
      .card {
        flex-direction: column;
        height: auto;
        max-height: none;
        min-height: 640px;
        border-radius: 24px;
      }

      .left-side {
        height: 280px;           /* Утас дээр spline-ийн өндөр багассан */
        flex: none;
      }

      .right-side {
        padding: 42px 28px;
      }

      .actions {
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        min-width: 100%;
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .card {
        border-radius: 20px;
      }
      .left-side {
        height: 260px;
      }
      .right-side {
        padding: 36px 22px;
      }
      .brand {
        font-size: 46px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Зүүн тал -->
    <div class="left-side">
      <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.78/build/spline-viewer.js"></script>
      <spline-viewer url="https://prod.spline.design/b1Ya5dnMQwTITU6D/scene.splinecode"></spline-viewer>
    </div>

    <!-- Баруун тал -->
    <div class="right-side">
      <div class="content">

        <!-- Login Panel -->
        <div id="login-panel">
          <div class="brand">Sand Box</div>
          <h1>Тавтай морил</h1>
          <p class="lead">Өөрийн бүртгэлтэй акаунтаараа нэвтэрнэ үү</p>

          <form onsubmit="event.preventDefault(); window.location.href='sandbox.html';">
            <div class="form-group">
              <label>Хэрэглэгчийн нэр</label>
              <input type="text" required placeholder="Нэрээ оруулна уу">
            </div>
            <div class="form-group">
              <label>Нууц үг</label>
              <input type="password" required placeholder="••••••••">
            </div>

            <div class="actions">
              <button class="btn btn-primary" type="submit"><a href="index.html" style="color: white; text-decoration: none;">Нэвтрэх</a></button>
              <button class="btn btn-ghost" type="button" onclick="toggleView('signup')">Бүртгүүлэх</button>
            </div>
          </form>
        </div>

        <!-- Signup Panel -->
        <div id="signup-panel" class="hidden">
          <div class="brand">Sand Box</div>
          <h1>Шинэ акаунт</h1>
          <p class="lead">Өөрийн мэдээллээ оруулаад эхэлцгээе</p>

          <form onsubmit="event.preventDefault(); alert('Амжилттай бүртгүүллээ! ✨'); toggleView('login');">
            <div class="form-group">
              <label>Овог нэр</label>
              <input type="text" required placeholder="Овог Нэр">
            </div>
            <div class="form-group">
              <label>Имэйл хаяг</label>
              <input type="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
              <label>Нууц үг</label>
              <input type="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
              <label>Оюутны код</label>
              <input type="text" required placeholder="Оюутны кодоо оруулна уу">
            </div>
            <div class="form-group">
              <label>Курс</label>
              <select>
                <option value="">Курс сонгоно уу</option>
                <option>1-курс</option>
                <option>2-курс</option>
                <option>3-курс</option>
                <option>4-курс</option>
              </select>
            </div>

            <div class="actions">
              <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>
              <button class="btn btn-ghost" type="button" onclick="toggleView('login')">Буцах</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    function toggleView(view) {
      const login = document.getElementById('login-panel');
      const signup = document.getElementById('signup-panel');
      
      if (view === 'signup') {
        login.style.opacity = '0';
        login.style.transform = 'translateX(-25px)';
        setTimeout(() => {
          login.classList.add('hidden');
          signup.classList.remove('hidden');
          signup.style.opacity = '0';
          signup.style.transform = 'translateX(25px)';
          void signup.offsetWidth;
          signup.style.transition = 'all 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
          signup.style.opacity = '1';
          signup.style.transform = 'translateX(0)';
        }, 280);
      } else {
        signup.style.opacity = '0';
        signup.style.transform = 'translateX(25px)';
        setTimeout(() => {
          signup.classList.add('hidden');
          login.classList.remove('hidden');
          login.style.opacity = '0';
          login.style.transform = 'translateX(-25px)';
          void login.offsetWidth;
          login.style.transition = 'all 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
          login.style.opacity = '1';
          login.style.transform = 'translateX(0)';
        }, 280);
      }
    }
  </script>
</body>
</html>
